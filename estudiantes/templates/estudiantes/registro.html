{% load static %}

<!DOCTYPE html>
<html>
    <head>
        <title>Registro</title>
        <link rel="stylesheet" href="{% static 'css/loginestilo.css' %}">
    </head>

    <body>
        <div class="contenedor">
            <div class="login-box">

                <h2>Crear cuenta</h2>

                <div class="input-group">
                    <label>Nombre de usuario</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="email" placeholder="Ingresa tu email" required>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="password1" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="input-group">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="password2" placeholder="Confirma tu contraseña" required>
                </div>

                <button onclick="registrar()">Registrarse</button>

                <p class="registro">
                    ¿Ya tienes cuenta? <a href="/login/">Iniciar sesión</a>
                </p>

            </div>
        </div>
    </body>

    <script>
        function registrar() {
            const username  = document.getElementById('username').value.trim();
            const email     = document.getElementById('email').value.trim();
            const password1 = document.getElementById('password1').value;
            const password2 = document.getElementById('password2').value;

            const body = new URLSearchParams({
                username: username,
                email: email,
                password1: password1,
                password2: password2
            }).toString();

            fetch('/registro/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Cuenta creada exitosamente.');
                    window.location.href = data.redirect_url;
                } else {
                    let mensajes = [];
                    try {
                        const errores = JSON.parse(data.detalle || '{}');
                        for (const campo in errores) {
                            errores[campo].forEach(e => mensajes.push(e.message));
                        }
                    } catch (_) {}
                    alert(mensajes.length ? mensajes.join('\n') : (data.error || 'Error al registrar'));
                }
            })
            .catch(() => alert('Error de conexión con el servidor.'));
        }
    </script>
</html>
